name: Build Dastan Wizard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --project-name dastan_wizard_compressor --org com.dastanwizard --platforms android /tmp/dw_project

      - name: Copy source files
        run: |
          cp dw_flutter/lib/main.dart /tmp/dw_project/lib/main.dart
          cp dw_flutter/pubspec.yaml /tmp/dw_project/pubspec.yaml
          cp dw_flutter/android/app/src/main/AndroidManifest.xml /tmp/dw_project/android/app/src/main/AndroidManifest.xml

      - name: Patch Android config
        run: |
          # 1. minSdk 24 (necesar pentru video_compress)
          find /tmp/dw_project/android -name "build.gradle" -path "*/app/*" \
            -exec sed -i 's/flutter\.minSdkVersion/24/g' {} \;

          # 2. Forțăm Kotlin 1.9.10 prin gradle.properties (cel mai fiabil mod)
          echo "" >> /tmp/dw_project/android/gradle.properties
          echo "kotlin.version=1.9.10" >> /tmp/dw_project/android/gradle.properties

          # 3. Patch orice format de kotlin_version din build.gradle
          sed -i "s/kotlin_version = '1\.[0-9][^']*'/kotlin_version = '1.9.10'/g" \
            /tmp/dw_project/android/build.gradle 2>/dev/null || true
          sed -i 's/kotlin_version = "1\.[0-9][^"]*"/kotlin_version = "1.9.10"/g' \
            /tmp/dw_project/android/build.gradle 2>/dev/null || true

          # 4. Forțăm stdlib-ul Kotlin prin resolution strategy
          echo "" >> /tmp/dw_project/android/app/build.gradle
          echo "configurations.all {" >> /tmp/dw_project/android/app/build.gradle
          echo "    resolutionStrategy {" >> /tmp/dw_project/android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'" >> /tmp/dw_project/android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10'" >> /tmp/dw_project/android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10'" >> /tmp/dw_project/android/app/build.gradle
          echo "    }" >> /tmp/dw_project/android/app/build.gradle
          echo "}" >> /tmp/dw_project/android/app/build.gradle

          echo "=== gradle.properties ==="
          cat /tmp/dw_project/android/gradle.properties
          echo "=== app/build.gradle (final 10 linii) ==="
          tail -15 /tmp/dw_project/android/app/build.gradle

      - name: Flutter pub get
        run: cd /tmp/dw_project && flutter pub get

      - name: Build APK
        run: cd /tmp/dw_project && flutter build apk --release --target-platform android-arm64 --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DastanWizard-APK
          path: /tmp/dw_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
