name: Build Dastan Wizard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --project-name dastan_wizard_compressor --org com.dastanwizard --platforms android /tmp/dw_project

      - name: Copy source files
        run: |
          cp dw_flutter/lib/main.dart /tmp/dw_project/lib/main.dart
          cp dw_flutter/pubspec.yaml /tmp/dw_project/pubspec.yaml
          cp dw_flutter/android/app/src/main/AndroidManifest.xml /tmp/dw_project/android/app/src/main/AndroidManifest.xml

      - name: Patch Android config
        run: |
          echo "=== BEFORE PATCH: android/build.gradle ==="
          cat /tmp/dw_project/android/build.gradle

          # Fix minSdk
          find /tmp/dw_project/android -name "build.gradle" -path "*/app/*" \
            -exec sed -i 's/flutter\.minSdkVersion/24/g' {} \;

          # Fix Kotlin version - acoperim toate formatele posibile
          GRADLE=/tmp/dw_project/android/build.gradle

          # Format 1: ext.kotlin_version = '1.x.x'
          sed -i "s/ext\.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.10'/" "$GRADLE" || true

          # Format 2: classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:x.x.x"
          sed -i 's/org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9][0-9.]*/org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10/g' "$GRADLE" || true

          # Format 3: dacă nu există deloc, adaugă ext.kotlin_version în buildscript
          if ! grep -q "kotlin_version\|kotlin-gradle-plugin" "$GRADLE" 2>/dev/null; then
            sed -i 's/^buildscript {/buildscript {\n    ext.kotlin_version = "1.9.10"/' "$GRADLE" || true
          fi

          echo "=== AFTER PATCH: android/build.gradle ==="
          cat /tmp/dw_project/android/build.gradle

      - name: Flutter pub get
        run: cd /tmp/dw_project && flutter pub get

      - name: Build APK
        run: cd /tmp/dw_project && flutter build apk --release --target-platform android-arm64 --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DastanWizard-APK
          path: /tmp/dw_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
